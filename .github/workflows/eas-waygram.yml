name: Trigger WayGram EAS Build

on:
  workflow_dispatch:

jobs:
  trigger-eas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout WayGram
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Verify Expo authentication
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Trigger EAS Android build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile waygram --non-interactive --no-wait
